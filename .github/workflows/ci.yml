name: ci
on:
  push:
    branches: [develop, main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: Node SDK
        run: cd sdk/node && npm test
      - name: Python SDK
        run: cd sdk/python && python3 -m unittest -v
      - name: Go SDK
        run: cd sdk/go && go vet ./... && go test ./...
      - name: Example manifests match the schema
        run: |
          npm i --no-save ajv@8
          node scripts/check-manifests.js
