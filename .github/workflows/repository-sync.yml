name: Repository synchronization

on:
  pull_request:
    paths:
      - scripts/sync_repositories.py
      - tests/test_repository_sync.py
      - .github/workflows/repository-sync.yml
  workflow_dispatch:
    inputs:
      apply:
        description: Create or update synchronization PRs (false only checks differences)
        type: boolean
        default: false
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read

concurrency:
  group: repository-synchronization
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v

  sync:
    needs: test
    if: >-
      github.repository == 'cuijianzhuang/polaris-plugins' &&
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' || vars.ENABLE_ORG_SYNC == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check differences or propose synchronization PRs
        env:
          PERSONAL_REPO_SYNC_TOKEN: ${{ secrets.PERSONAL_REPO_SYNC_TOKEN }}
          ORG_REPO_SYNC_TOKEN: ${{ secrets.ORG_REPO_SYNC_TOKEN }}
          SYNC_APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          if [ "$SYNC_APPLY" = 'true' ]; then
            python3 scripts/sync_repositories.py --apply
          else
            python3 scripts/sync_repositories.py
          fi
