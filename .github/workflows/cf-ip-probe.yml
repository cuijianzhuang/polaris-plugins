name: cf-ip-probe
# Pull requests that touch cf-ip-probe: test and build every platform
# (archives attached to the run).
# Every merge to main that touches it: the next version is computed from the
# last cf-ip-probe-vX.Y.Z tag (patch + 1; the first release is 0.2.0), then
# it is tagged, built and published as a GitHub release. The installer
# (examples/cf-ip-probe/scripts/install.sh) downloads from those releases.
# "Run workflow" by hand can bump minor or major instead.
# Releases are cut only from the cuijianzhuang copy.
on:
  push:
    branches: [main]
    paths:
      - 'examples/cf-ip-probe/**'
      - '.github/workflows/cf-ip-probe.yml'
  pull_request:
    paths:
      - 'examples/cf-ip-probe/**'
      - '.github/workflows/cf-ip-probe.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version part to increase'
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

# One release at a time, so two quick merges never compute the same version.
# Several cf-ip-probe merges in a row release only the newest: a run waits a
# little, skips itself when a later commit on main also changes cf-ip-probe
# (GitHub keeps only the newest queued run), and checks again before tagging.
concurrency:
  group: cf-ip-probe-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release only the newest cf-ip-probe change on main
        id: latest
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          WAIT: 60
        run: |
          set -euo pipefail
          sleep "$WAIT"
          # Stale when a later commit on main also touches cf-ip-probe: its
          # own run (the newest one queued) releases instead.
          files=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${GITHUB_REF_NAME}" --jq '.files[].filename')
          if printf '%s\n' "$files" | grep -qE '^(examples/cf-ip-probe/|\.github/workflows/cf-ip-probe\.yml$)'; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::a newer cf-ip-probe change is on ${GITHUB_REF_NAME}; its run releases instead of ${GITHUB_SHA::7}"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: Version
        id: v
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          OWNER: ${{ github.repository_owner }}
          STALE: ${{ steps.latest.outputs.stale }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ] || [ "$OWNER" != cuijianzhuang ] || [ "$GITHUB_REF" != refs/heads/main ] || [ "$STALE" = true ]; then
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git tag -l 'cf-ip-probe-v*' --sort=-v:refname | head -n 1)
          if [ -z "$last" ]; then
            next=0.2.0
          else
            IFS=. read -r major minor patch <<<"${last#cf-ip-probe-v}"
            case $BUMP in
              major) next=$((major + 1)).0.0 ;;
              minor) next=$major.$((minor + 1)).0 ;;
              *) next=$major.$minor.$((patch + 1)) ;;
            esac
          fi
          echo "last release: ${last:-none}; next: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"
      - name: Test
        working-directory: examples/cf-ip-probe
        run: go vet ./... && go test -race ./...
      - name: Installer syntax
        run: sh -n examples/cf-ip-probe/scripts/install.sh && shellcheck -s sh examples/cf-ip-probe/scripts/install.sh
      - name: Independent installer instances
        run: python3 examples/cf-ip-probe/scripts/installer-instances-test.py
      - name: Build
        run: examples/cf-ip-probe/scripts/build.sh "${{ steps.v.outputs.version }}" dist
      - name: Smoke test
        run: |
          tar -xzf dist/cf-ip-probe-linux-amd64.tar.gz -C /tmp cf-ip-probe
          /tmp/cf-ip-probe -version | grep -F "${{ steps.v.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cf-ip-probe-${{ steps.v.outputs.version }}
          path: dist/
          retention-days: 14

  release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cf-ip-probe-${{ needs.build.outputs.version }}
          path: dist
      - name: Release only the newest cf-ip-probe change on main
        id: latest
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          WAIT: 0
        run: |
          set -euo pipefail
          sleep "$WAIT"
          # Stale when a later commit on main also touches cf-ip-probe: its
          # own run (the newest one queued) releases instead.
          files=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${GITHUB_REF_NAME}" --jq '.files[].filename')
          if printf '%s\n' "$files" | grep -qE '^(examples/cf-ip-probe/|\.github/workflows/cf-ip-probe\.yml$)'; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::a newer cf-ip-probe change is on ${GITHUB_REF_NAME}; its run releases instead of ${GITHUB_SHA::7}"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Tag and publish
        if: steps.latest.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: cf-ip-probe-v${{ needs.build.outputs.version }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          notes="cf-ip-probe $VERSION：CDN 优选 IP 测速点（提交 ${GITHUB_SHA::7}）。

          一键安装（Linux，含 OpenWrt / Alpine）：

          \`\`\`sh
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | sudo sh -s -- --api … --token … --profile … --source … --host …
          \`\`\`

          说明见 examples/cf-ip-probe/README.md。"
          # Creates the tag on this commit together with the release.
          gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "cf-ip-probe $VERSION" --notes "$notes" --latest
